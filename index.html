<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
            text-align: center;
        }

        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .month-nav button {
            background: #667eea;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .month-nav button:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .month-display {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-align: center;
            min-width: 150px;
        }

        .piggy-bank {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            margin-bottom: 20px;
            position: relative;
        }

        .piggy-edit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .piggy-edit-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .piggy-bank .label {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .piggy-bank .amount {
            font-size: 36px;
            font-weight: bold;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            padding: 15px;
            border-radius: 15px;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card.income { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .card.spent { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .card.saved { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .card.action { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            transition: all 0.3s;
        }

        .card.action:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card.action .card-label {
            font-size: 13px;
        }

        .card-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .card-amount {
            font-size: 24px;
            font-weight: bold;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .add-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .add-btn:hover {
            background: #764ba2;
        }

        .income-list, .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .income-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #38ef7d;
            flex-wrap: wrap;
            gap: 10px;
        }

        .income-item-content {
            flex: 1;
            min-width: 150px;
        }

        .expense-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            flex-wrap: wrap;
            gap: 10px;
        }

        .expense-bar {
            height: 8px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            margin: 10px 0;
            transition: all 0.3s;
        }

        .expense-subitems {
            margin-top: 10px;
            padding-left: 10px;
            display: none;
        }

        .expense-subitems.show {
            display: block;
        }

        .subitem {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 5px;
        }

        .edit-btn, .delete-btn {
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
        }

        .edit-btn {
            background: #667eea;
        }

        .edit-btn:hover {
            background: #764ba2;
        }

        .delete-btn {
            background: #ff4757;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .month-display {
                font-size: 18px;
                min-width: 120px;
            }

            .piggy-bank .amount {
                font-size: 24px;
            }

            .card-amount {
                font-size: 20px;
            }

            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .section-title {
                font-size: 16px;
            }

            .modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px;
            }

            .card {
                padding: 12px;
            }

            .card-amount {
                font-size: 18px;
            }

            .all-time-saved .amount {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Expense Tracker</h1>
            <div class="month-nav">
                <button onclick="prevMonth()">←</button>
                <div class="month-display" id="monthDisplay"></div>
                <button onclick="nextMonth()">→</button>
            </div>
        </div>

        <div class="piggy-bank">
            <button class="piggy-edit-btn" onclick="editPiggyBank()">Edit</button>
            <div class="label">🐷 Piggy Bank</div>
            <div class="amount" id="piggyBank">$0.00</div>
        </div>

        <div class="summary-cards">
            <div class="card income">
                <div class="card-label">Total Income</div>
                <div class="card-amount" id="totalIncome">$0</div>
            </div>
            <div class="card spent">
                <div class="card-label">Spent</div>
                <div class="card-amount" id="totalSpent">$0</div>
            </div>
            <div class="card saved">
                <div class="card-label">Saved</div>
                <div class="card-amount" id="totalSaved">$0</div>
            </div>
            <div class="card action" onclick="addToPiggyBank()">
                <div class="card-label">💰 Add This Month's Savings</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>Income Sources</span>
                <button class="add-btn" onclick="openIncomeModal()">+ Add Income</button>
            </div>
            <div class="income-list" id="incomeList"></div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>Expenses</span>
                <button class="add-btn" onclick="openExpenseModal()">+ Add Expense</button>
            </div>
            <div class="expense-list" id="expenseList"></div>
        </div>
    </div>

    <!-- Income Modal -->
    <div class="modal" id="incomeModal">
        <div class="modal-content">
            <div class="modal-title" id="incomeModalTitle">Add Income</div>
            <div class="form-group">
                <label>Source Name</label>
                <input type="text" id="incomeName" placeholder="e.g., Your Salary">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="incomeAmount" placeholder="0.00" step="0.01">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeIncomeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveIncome()">Save</button>
            </div>
        </div>
    </div>

    <!-- Expense Modal -->
    <div class="modal" id="expenseModal">
        <div class="modal-content">
            <div class="modal-title">Add Expense Category</div>
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" id="expenseName" placeholder="e.g., Groceries">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeExpenseModal()">Cancel</button>
                <button class="btn-primary" onclick="addExpense()">Add</button>
            </div>
        </div>
    </div>

    <!-- Subitem Modal -->
    <div class="modal" id="subitemModal">
        <div class="modal-content">
            <div class="modal-title">Add Item</div>
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="subitemName" placeholder="e.g., Bread">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="subitemAmount" placeholder="0.00" step="0.01">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeSubitemModal()">Cancel</button>
                <button class="btn-primary" onclick="addSubitem()">Add</button>
            </div>
        </div>
    </div>

    <!-- Piggy Bank Edit Modal -->
    <div class="modal" id="piggyBankModal">
        <div class="modal-content">
            <div class="modal-title">Edit Piggy Bank</div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="piggyBankAmount" placeholder="0.00" step="0.01">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closePiggyBankModal()">Cancel</button>
                <button class="btn-primary" onclick="savePiggyBank()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let data = {
            incomes: [], // Global incomes
            months: {},  // Month-specific expenses
            piggyBank: 0 // Total saved in piggy bank
        };
        let currentExpenseId = null;
        let editingIncomeIdx = null;

        function getMonthKey() {
            return `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
        }

        function initMonth() {
            const key = getMonthKey();
            if (!data.months[key]) {
                data.months[key] = {
                    expenses: [],
                    addedToPiggyBank: false
                };
            }
        }

        function addToPiggyBank() {
            const monthData = data.months[getMonthKey()];
            
            if (monthData.addedToPiggyBank) {
                alert('This month\'s savings have already been added to the Piggy Bank!');
                return;
            }

            const totalIncome = data.incomes.reduce((sum, inc) => sum + inc.amount, 0);
            const totalSpent = monthData.expenses.reduce((sum, exp) => {
                return sum + exp.subitems.reduce((s, sub) => s + sub.amount, 0);
            }, 0);
            const saved = totalIncome - totalSpent;

            if (saved > 0) {
                data.piggyBank += saved;
                monthData.addedToPiggyBank = true;
                updateDisplay();
                alert(`${saved.toFixed(2)} added to Piggy Bank!`);
            } else {
                alert('No savings to add this month.');
            }
        }

        function updateDisplay() {
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                          'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('monthDisplay').textContent = 
                `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            
            initMonth();
            const monthData = data.months[getMonthKey()];
            
            // Calculate totals
            const totalIncome = data.incomes.reduce((sum, inc) => sum + inc.amount, 0);
            const totalSpent = monthData.expenses.reduce((sum, exp) => {
                return sum + exp.subitems.reduce((s, sub) => s + sub.amount, 0);
            }, 0);
            const saved = totalIncome - totalSpent;

            document.getElementById('totalIncome').textContent = `${totalIncome.toFixed(2)}`;
            document.getElementById('totalSpent').textContent = `${totalSpent.toFixed(2)}`;
            document.getElementById('totalSaved').textContent = `${saved.toFixed(2)}`;
            document.getElementById('piggyBank').textContent = `${data.piggyBank.toFixed(2)}`;

            // Render income list
            const incomeList = document.getElementById('incomeList');
            incomeList.innerHTML = data.incomes.map((inc, idx) => `
                <div class="income-item">
                    <div class="income-item-content">
                        <strong>${inc.name}</strong>
                    </div>
                    <span>
                        $${inc.amount.toFixed(2)}
                        <button class="edit-btn" onclick="editIncome(${idx})">Edit</button>
                    </span>
                </div>
            `).join('');

            // Render expense list
            const expenseList = document.getElementById('expenseList');
            expenseList.innerHTML = monthData.expenses.map((exp, idx) => {
                const total = exp.subitems.reduce((s, sub) => s + sub.amount, 0);
                const percentage = totalIncome > 0 ? (total / totalIncome) * 100 : 0;
                return `
                    <div class="expense-item">
                        <div class="expense-header" onclick="toggleExpense(${idx})">
                            <span><strong>${exp.name}</strong> (${exp.subitems.length} items)</span>
                            <span>
                                $${total.toFixed(2)}
                                <button class="delete-btn" onclick="event.stopPropagation(); deleteExpense(${idx})">Delete</button>
                            </span>
                        </div>
                        <div class="expense-bar" style="width: ${Math.min(percentage, 100)}%"></div>
                        <button class="add-btn" style="margin-top: 10px;" onclick="event.stopPropagation(); openSubitemModal(${idx})">+ Add Item</button>
                        <div class="expense-subitems" id="expense-${idx}">
                            ${exp.subitems.map((sub, subIdx) => `
                                <div class="subitem">
                                    <span>${sub.name}</span>
                                    <span>
                                        $${sub.amount.toFixed(2)}
                                        <button class="delete-btn" onclick="deleteSubitem(${idx}, ${subIdx})">Delete</button>
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateDisplay();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateDisplay();
        }

        function openIncomeModal() {
            editingIncomeIdx = null;
            document.getElementById('incomeModalTitle').textContent = 'Add Income';
            document.getElementById('incomeModal').classList.add('show');
            document.getElementById('incomeName').value = '';
            document.getElementById('incomeAmount').value = '';
        }

        function closeIncomeModal() {
            document.getElementById('incomeModal').classList.remove('show');
            editingIncomeIdx = null;
        }

        function editIncome(idx) {
            editingIncomeIdx = idx;
            const income = data.incomes[idx];
            document.getElementById('incomeModalTitle').textContent = 'Edit Income';
            document.getElementById('incomeName').value = income.name;
            document.getElementById('incomeAmount').value = income.amount;
            document.getElementById('incomeModal').classList.add('show');
        }

        function saveIncome() {
            const name = document.getElementById('incomeName').value;
            const amount = parseFloat(document.getElementById('incomeAmount').value);
            
            if (name && amount > 0) {
                if (editingIncomeIdx !== null) {
                    // Edit existing income
                    data.incomes[editingIncomeIdx] = { name, amount };
                } else {
                    // Add new income
                    data.incomes.push({ name, amount });
                }
                closeIncomeModal();
                updateDisplay();
            }
        }

        function openExpenseModal() {
            document.getElementById('expenseModal').classList.add('show');
            document.getElementById('expenseName').value = '';
        }

        function closeExpenseModal() {
            document.getElementById('expenseModal').classList.remove('show');
        }

        function addExpense() {
            const name = document.getElementById('expenseName').value;
            
            if (name) {
                const monthData = data.months[getMonthKey()];
                monthData.expenses.push({ name, subitems: [] });
                closeExpenseModal();
                updateDisplay();
            }
        }

        function deleteExpense(idx) {
            const monthData = data.months[getMonthKey()];
            monthData.expenses.splice(idx, 1);
            updateDisplay();
        }

        function toggleExpense(idx) {
            const elem = document.getElementById(`expense-${idx}`);
            elem.classList.toggle('show');
        }

        function openSubitemModal(expenseIdx) {
            currentExpenseId = expenseIdx;
            document.getElementById('subitemModal').classList.add('show');
            document.getElementById('subitemName').value = '';
            document.getElementById('subitemAmount').value = '';
        }

        function closeSubitemModal() {
            document.getElementById('subitemModal').classList.remove('show');
            currentExpenseId = null;
        }

        function addSubitem() {
            const name = document.getElementById('subitemName').value;
            const amount = parseFloat(document.getElementById('subitemAmount').value);
            
            if (name && amount > 0 && currentExpenseId !== null) {
                const monthData = data.months[getMonthKey()];
                monthData.expenses[currentExpenseId].subitems.push({ name, amount });
                closeSubitemModal();
                updateDisplay();
            }
        }

        function deleteSubitem(expenseIdx, subitemIdx) {
            const monthData = data.months[getMonthKey()];
            monthData.expenses[expenseIdx].subitems.splice(subitemIdx, 1);
            updateDisplay();
        }

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
