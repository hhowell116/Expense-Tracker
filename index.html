<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-container h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .google-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            transition: all 0.3s;
            width: 100%;
        }

        .google-btn:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
            text-align: center;
        }

        .user-info {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #667eea;
        }

        .hamburger-menu {
            position: relative;
        }

        .hamburger-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            color: #667eea;
            transition: all 0.3s;
        }

        .hamburger-btn:hover {
            color: #764ba2;
        }

        .dropdown-menu {
            position: absolute;
            top: 40px;
            right: 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            padding: 10px;
            min-width: 180px;
            display: none;
            z-index: 1000;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-size: 14px;
        }

        .dropdown-item:hover {
            background: #f0f0f0;
        }

        .dropdown-item.logout {
            color: #ff4757;
            border-top: 1px solid #e0e0e0;
            margin-top: 5px;
        }

        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .month-nav button {
            background: #667eea;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .month-nav button:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .month-display {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-align: center;
            min-width: 150px;
        }

        .piggy-bank {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            margin-bottom: 20px;
            position: relative;
        }

        .piggy-edit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 10;
        }

        .piggy-edit-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .piggy-bank .label {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .piggy-bank .amount {
            font-size: 36px;
            font-weight: bold;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            padding: 15px;
            border-radius: 15px;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card.income { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .card.spent { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .card.saved { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .card.action { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            transition: all 0.3s;
        }

        .card.action:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card.action .card-label {
            font-size: 13px;
        }

        .card-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .card-amount {
            font-size: 24px;
            font-weight: bold;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .add-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .add-btn:hover {
            background: #764ba2;
        }

        .income-list, .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .income-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #38ef7d;
            flex-wrap: wrap;
            gap: 10px;
        }

        .income-item-content {
            flex: 1;
            min-width: 150px;
        }

        .expense-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            flex-wrap: wrap;
            gap: 10px;
        }

        .expense-bar {
            height: 8px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            margin: 10px 0;
            transition: all 0.3s;
        }

        .expense-subitems {
            margin-top: 10px;
            padding-left: 10px;
            display: none;
        }

        .expense-subitems.show {
            display: block;
        }

        .subitem {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 5px;
        }

        .edit-btn, .delete-btn {
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
        }

        .edit-btn {
            background: #667eea;
        }

        .edit-btn:hover {
            background: #764ba2;
        }

        .delete-btn {
            background: #ff4757;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 18px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .month-display {
                font-size: 18px;
                min-width: 120px;
            }

            .piggy-bank .amount {
                font-size: 24px;
            }

            .card-amount {
                font-size: 20px;
            }

            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .section-title {
                font-size: 16px;
            }

            .modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px;
            }

            .card {
                padding: 12px;
            }

            .card-amount {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="login-container">
        <h1>💰 Expense Tracker</h1>
        <p style="color: #666; margin-bottom: 30px;">Track your monthly expenses with your partner</p>
        <button class="google-btn" id="googleSignInBtn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </button>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="container hidden">
        <div class="header">
            <div class="user-info">
                <img id="userAvatar" class="user-avatar" src="" alt="User">
                <div class="hamburger-menu">
                    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" onclick="toggleMenu()">
                            <span id="userName">User</span>
                        </div>
                        <div class="dropdown-item logout" onclick="signOut()">
                            🚪 Sign Out
                        </div>
                    </div>
                </div>
            </div>
            <h1>Expense Tracker</h1>
            <div class="month-nav">
                <button onclick="prevMonth()">←</button>
                <div class="month-display" id="monthDisplay"></div>
                <button onclick="nextMonth()">→</button>
            </div>
        </div>

        <div class="piggy-bank">
            <button class="piggy-edit-btn" onclick="editPiggyBank()">Edit</button>
            <div class="label">🐷 Piggy Bank</div>
            <div class="amount" id="piggyBank">$0.00</div>
        </div>

        <div class="summary-cards">
            <div class="card income">
                <div class="card-label">Total Income</div>
                <div class="card-amount" id="totalIncome">$0</div>
            </div>
            <div class="card spent">
                <div class="card-label">Spent</div>
                <div class="card-amount" id="totalSpent">$0</div>
            </div>
            <div class="card saved">
                <div class="card-label">Saved</div>
                <div class="card-amount" id="totalSaved">$0</div>
            </div>
            <div class="card action" onclick="addToPiggyBank()">
                <div class="card-label">💰 Add This Month's Savings</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>Income Sources</span>
                <button class="add-btn" onclick="openIncomeModal()">+ Add Income</button>
            </div>
            <div class="income-list" id="incomeList"></div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>Expenses</span>
                <button class="add-btn" onclick="openExpenseModal()">+ Add Expense</button>
            </div>
            <div class="expense-list" id="expenseList"></div>
        </div>
    </div>

    <!-- Income Modal -->
    <div class="modal" id="incomeModal">
        <div class="modal-content">
            <div class="modal-title" id="incomeModalTitle">Add Income</div>
            <div class="form-group">
                <label>Source Name</label>
                <input type="text" id="incomeName" placeholder="e.g., Your Salary">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="incomeAmount" placeholder="0.00" step="0.01">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeIncomeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveIncome()">Save</button>
            </div>
        </div>
    </div>

    <!-- Expense Modal -->
    <div class="modal" id="expenseModal">
        <div class="modal-content">
            <div class="modal-title">Add Expense Category</div>
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" id="expenseName" placeholder="e.g., Groceries">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeExpenseModal()">Cancel</button>
                <button class="btn-primary" onclick="addExpense()">Add</button>
            </div>
        </div>
    </div>

    <!-- Subitem Modal -->
    <div class="modal" id="subitemModal">
        <div class="modal-content">
            <div class="modal-title">Add Item</div>
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="subitemName" placeholder="e.g., Bread">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="subitemAmount" placeholder="0.00" step="0.01">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeSubitemModal()">Cancel</button>
                <button class="btn-primary" onclick="addSubitem()">Add</button>
            </div>
        </div>
    </div>

    <!-- Piggy Bank Edit Modal -->
    <div class="modal" id="piggyBankModal">
        <div class="modal-content">
            <div class="modal-title">Edit Piggy Bank</div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="piggyBankAmount" placeholder="0.00" step="0.01">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closePiggyBankModal()">Cancel</button>
                <button class="btn-primary" onclick="savePiggyBank()">Save</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut as firebaseSignOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDF94pM__lUv4cc1vho0p4WMjkAF8N3qZE",
            authDomain: "monthly-expense-tracker-1ecba.firebaseapp.com",
            projectId: "monthly-expense-tracker-1ecba",
            storageBucket: "monthly-expense-tracker-1ecba.firebasestorage.app",
            messagingSenderId: "1012162422410",
            appId: "1:1012162422410:web:65d7686b5871cfc4d3af73"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let unsubscribe = null;

        // Sign in function
        async function signInWithGoogle() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('Sign in error:', error);
                alert('Failed to sign in. Please try again.');
            }
        }

        // Sign out function
        window.signOut = async function() {
            try {
                if (unsubscribe) unsubscribe();
                await firebaseSignOut(auth);
                document.getElementById('loginContainer').classList.remove('hidden');
                document.getElementById('appContainer').classList.add('hidden');
                const menu = document.getElementById('dropdownMenu');
                if (menu) menu.classList.remove('show');
            } catch (error) {
                console.error('Sign out error:', error);
            }
        };

        // Listen for auth state changes
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userAvatar').src = user.photoURL || '';
                document.getElementById('userName').textContent = user.displayName || user.email;
                
                // Load user data from Firestore
                await loadUserData(user.uid);
                
                // Set up real-time listener
                const docRef = doc(db, 'users', user.uid);
                unsubscribe = onSnapshot(docRef, (doc) => {
                    if (doc.exists()) {
                        window.data = doc.data();
                        updateDisplay();
                    }
                });
            } else {
                currentUser = null;
                document.getElementById('loginContainer').classList.remove('hidden');
                document.getElementById('appContainer').classList.add('hidden');
            }
        });

        async function loadUserData(uid) {
            const docRef = doc(db, 'users', uid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                window.data = docSnap.data();
            } else {
                // Initialize new user data
                window.data = {
                    incomes: [],
                    months: {},
                    piggyBank: 0
                };
                await saveData();
            }
            updateDisplay();
        }

        window.saveData = async function() {
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'users', currentUser.uid);
                await setDoc(docRef, window.data);
            } catch (error) {
                console.error('Error saving data:', error);
                alert('Failed to save data. Please try again.');
            }
        };

        // Attach sign in to button
        document.getElementById('googleSignInBtn').addEventListener('click', signInWithGoogle);
    </script>

    <script>
        let currentDate = new Date();
        let data = {
            incomes: [],
            months: {},
            piggyBank: 0
        };
        let currentExpenseId = null;
        let editingIncomeIdx = null;

        function getMonthKey() {
            return `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
        }

        function initMonth() {
            const key = getMonthKey();
            if (!data.months[key]) {
                data.months[key] = {
                    expenses: [],
                    addedToPiggyBank: false
                };
            }
        }

        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('dropdownMenu');
            const hamburger = document.querySelector('.hamburger-btn');
            if (menu && !menu.contains(event.target) && event.target !== hamburger) {
                menu.classList.remove('show');
            }
        });

        function addToPiggyBank() {
            const monthData = data.months[getMonthKey()];
            
            if (monthData.addedToPiggyBank) {
                alert('This month\'s savings have already been added to the Piggy Bank!');
                return;
            }

            const totalIncome = data.incomes.reduce((sum, inc) => sum + inc.amount, 0);
            const totalSpent = monthData.expenses.reduce((sum, exp) => {
                return sum + exp.subitems.reduce((s, sub) => s + sub.amount, 0);
            }, 0);
            const saved = totalIncome - totalSpent;

            if (saved > 0) {
                data.piggyBank += saved;
                monthData.addedToPiggyBank = true;
                saveData();
                updateDisplay();
                alert(`$${saved.toFixed(2)} added to Piggy Bank!`);
            } else {
                alert('No savings to add this month.');
            }
        }

        function editPiggyBank() {
            document.getElementById('piggyBankAmount').value = data.piggyBank;
            document.getElementById('piggyBankModal').classList.add('show');
        }

        function closePiggyBankModal() {
            document.getElementById('piggyBankModal').classList.remove('show');
        }

        function savePiggyBank() {
            const amount = parseFloat(document.getElementById('piggyBankAmount').value);
            
            if (!isNaN(amount) && amount >= 0) {
                data.piggyBank = amount;
                closePiggyBankModal();
                saveData();
                updateDisplay();
            }
        }
